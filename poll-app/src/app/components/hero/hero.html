
<section class="hero">

  <h1 class="hero__title">
    Collect Feedback,<br>
    Unlock Ideas
  </h1>

  <div
    class="hero__image"
    role="img"
    aria-label="Illustration of a survey with feedback symbols"
  >
    <img
      class="hero__base"
      src="assets/img/pollscreen.png"
      alt=""
    />

    <img
      class="hero__element hero__element--question"
      src="assets/img/questin_mark.svg"
      alt=""
    />

    <img
      class="hero__element hero__element--check"
      src="assets/img/check.svg"
      alt=""
    />

    <img
      class="hero__element hero__element--bubble"
      src="assets/img/typing_bubble.svg"
      alt=""
    />

    <img
      class="hero__element hero__element--star"
      src="assets/img/star.svg"
      alt=""
    />
  </div>

  <p class="hero__description">
    Create and share surveys in minutes – from team events to
    workplace culture. Collect opinions, engage your audience,
    and turn feedback into action.
  </p>

  <button
    class="hero__button"
    type="button"
    routerLink="/create-survey"
  >
    <span>New survey</span>

    <img
      src="assets/img/primary_button_add_circle.svg"
      alt=""
      aria-hidden="true"
    />
  </button>

</section>
