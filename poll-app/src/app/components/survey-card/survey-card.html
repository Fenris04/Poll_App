
<a
  class="survey-card"
  [class.survey-card--compact]="compact"
  [routerLink]="['/survey', survey.id]"
  [attr.aria-label]="'Open survey: ' + survey.title">

  <div class="survey-card__content">
    <span class="survey-card__category">
      {{ survey.category || 'General' }}
    </span>

    <h3 class="survey-card__title">
      {{ survey.title }}
    </h3>
  </div>

  <span class="survey-card__date">
    {{ expirationText }}
  </span>
</a>
