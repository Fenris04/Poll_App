
<app-header></app-header>

<app-hero></app-hero>

<main class="poll-app">
  <section class="surveys">
    <h2>Your surveys</h2>

    @if (surveys.length > 0) {
      <div class="surveys__grid">
        @for (survey of surveys; track survey.id) {
          <app-survey-card
            [survey]="survey"
          ></app-survey-card>
        }
      </div>
    } @else {
      <p>No surveys available.</p>
    }
  </section>
</main>
