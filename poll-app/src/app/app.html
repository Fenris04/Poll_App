
<main class="poll-app">
  <h1>Poll App</h1>

  @if (surveys.length > 0) {
    <section class="survey">
      <h2>{{ surveys[0].title }}</h2>
      <p>{{ surveys[0].description }}</p>

      @for (option of surveyOptions; track option.id) {
        <p>○ {{ option.text }}</p>
      }
    </section>
  } @else {
    <p>No surveys available.</p>
  }
</main>
