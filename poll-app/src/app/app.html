<app-header></app-header>

<app-hero></app-hero>

<main class="poll-app">
  <section class="surveys">
    <h2>Your surveys</h2>

    <h3 class="surveys__subtitle">Active surveys</h3>

    @if (activeSurveys.length > 0) {
      <div class="surveys__grid">
        @for (survey of activeSurveys; track survey.id) {
          <app-survey-card [survey]="survey"></app-survey-card>
        }
      </div>
    } @else {
      <p class="surveys__empty">No active surveys available.</p>
    }
  </section>
</main>
